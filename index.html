<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1">

<title>Jonathan AI v5</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#111827;
    color:white;
}

body{
    display:flex;
    justify-content:center;
}

.app{
    width:100%;
    max-width:600px;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    background:#111827;
}

/* ================= HEADER ================= */

.header{
    height:158px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    padding:20px 30px;
    background:#151d31;
    border-bottom:2px solid #30394d;
}

.logo{
    width:82px;
    height:82px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #444b59;
    margin-right:18px;
}

.title{
    flex:1;
}

.title h1{
    font-size:34px;
    font-weight:800;
    margin-bottom:6px;
}

.status{
    font-size:19px;
    color:#8df2b5;
}

.status-dot{
    color:#54e28a;
    font-size:22px;
}

/* ================= CHAT ================= */

.chat{
    flex:1;
    overflow-y:auto;
    padding:48px 30px 25px;
    background:#111827;
}

.message{
    display:flex;
    margin-bottom:20px;
}

.message.ai{
    justify-content:flex-start;
}

.message.user{
    justify-content:flex-end;
}

.bubble{
    max-width:88%;
    padding:18px 20px;
    font-size:21px;
    line-height:1.5;
    border-radius:22px;
    white-space:pre-wrap;
    word-wrap:break-word;
}

.ai .bubble{
    background:#202c45;
    border-bottom-left-radius:7px;
}

.user .bubble{
    background:#2563eb;
    border-bottom-right-radius:7px;
}

.reply-actions{
    display:flex;
    gap:7px;
    margin-top:12px;
}

.speak-button{
    border:0;
    background:#313d55;
    color:white;
    padding:8px 13px;
    border-radius:12px;
    font-size:13px;
}

.speak-button:active{
    transform:scale(.96);
}

.time{
    font-size:10px;
    opacity:.45;
    margin-top:7px;
    text-align:right;
}

/* ================= QUICK BUTTONS ================= */

.quick{
    height:85px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:12px;
    overflow-x:auto;
    padding:10px 22px;
    background:#151d31;
    border-top:1px solid #252f44;
    border-bottom:2px solid #30394d;
}

.quick::-webkit-scrollbar{
    display:none;
}

.quick button{
    flex-shrink:0;
    border:0;
    padding:13px 22px;
    border-radius:28px;
    background:#202d46;
    color:white;
    font-size:19px;
}

/* ================= INPUT ================= */

.input-area{
    flex-shrink:0;
    background:#151d31;
    padding:12px 20px 15px;
}

.controls{
    display:flex;
    align-items:center;
    gap:12px;
}

.mic{
    width:60px;
    height:60px;
    border-radius:50%;
    border:0;
    background:#16b94d;
    color:white;
    font-size:28px;
    flex-shrink:0;
}

.mic.listening{
    background:#e32645;
}

.input-box{
    flex:1;
    height:60px;
    border:0;
    outline:none;
    border-radius:32px;
    padding:0 22px;
    background:#202c45;
    color:white;
    font-size:19px;
}

.input-box::placeholder{
    color:#9299a8;
}

.send{
    width:60px;
    height:60px;
    border-radius:50%;
    border:0;
    background:#2563eb;
    color:white;
    font-size:30px;
    font-weight:bold;
    flex-shrink:0;
}

.send:active,
.mic:active,
.quick button:active{
    transform:scale(.95);
}

.note{
    text-align:center;
    color:#8b94a7;
    font-size:13px;
    line-height:1.4;
    padding:13px 5px 0;
}

/* ================= TYPING ================= */

.typing{
    opacity:.65;
    font-style:italic;
}

/* ================= SMALL PHONES ================= */

@media(max-width:400px){

    .header{
        height:125px;
        padding:15px 20px;
    }

    .logo{
        width:65px;
        height:65px;
    }

    .title h1{
        font-size:27px;
    }

    .status{
        font-size:15px;
    }

    .chat{
        padding:30px 18px 20px;
    }

    .bubble{
        font-size:17px;
    }

    .quick{
        height:70px;
        padding:7px 15px;
    }

    .quick button{
        font-size:15px;
        padding:10px 17px;
    }

    .mic,
    .send{
        width:53px;
        height:53px;
    }

    .input-box{
        height:53px;
        font-size:16px;
    }

    .note{
        font-size:11px;
    }
}

</style>
</head>

<body>

<div class="app">

<!-- HEADER -->

<div class="header">

    <img
        src="jonathan.jpg"
        class="logo"
        alt="Jonathan">

    <div class="title">

        <h1>Jonathan AI</h1>

        <div class="status">
            <span class="status-dot">●</span>
            Voice enabled
        </div>

    </div>

</div>


<!-- CHAT -->

<div
    class="chat"
    id="chat">
</div>


<!-- QUICK BUTTONS -->

<div class="quick">

    <button onclick="quickAsk('Who is Hafisa?')">
        Hafisa ❤️
    </button>

    <button onclick="quickAsk('Tell me our love story')">
        Love story 💕
    </button>

    <button onclick="quickAsk('Where did you meet Hafisa?')">
        Our school 🏫
    </button>

</div>


<!-- INPUT -->

<div class="input-area">

    <div class="controls">

        <button
            class="mic"
            id="mic"
            onclick="startListening()">
            🎙️
        </button>

        <input
            class="input-box"
            id="input"
            type="text"
            placeholder="Type or speak"
            autocomplete="off">

        <button
            class="send"
            onclick="sendMessage()">
            ➤
        </button>

    </div>

    <div class="note">
        Voice input uses your device's speech-recognition support.
        Tap Speak on a reply to hear Jonathan.
    </div>

</div>

</div>


<script>

/* =========================================
   JONATHAN AI V5
========================================= */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const mic =
    document.getElementById("mic");


/* =========================================
   CHAT MEMORY
========================================= */

const MEMORY_KEY =
    "jonathan_ai_v5_chat";


function saveChat(){

    localStorage.setItem(
        MEMORY_KEY,
        chat.innerHTML
    );

}


function loadChat(){

    const saved =
        localStorage.getItem(
            MEMORY_KEY
        );

    if(saved){

        chat.innerHTML =
            saved;

    }

}


function clearChat(){

    localStorage.removeItem(
        MEMORY_KEY
    );

    chat.innerHTML = "";

    welcome();

}


/* =========================================
   TIME
========================================= */

function getTime(){

    return new Date()
        .toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}


/* =========================================
   ADD MESSAGE
========================================= */

function addMessage(
    text,
    sender
){

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message " +
        sender;


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";


    const content =
        document.createElement(
            "div"
        );

    content.textContent =
        text;


    bubble.appendChild(
        content
    );


    if(sender === "ai"){

        const actions =
            document.createElement(
                "div"
            );

        actions.className =
            "reply-actions";


        const speakButton =
            document.createElement(
                "button"
            );

        speakButton.className =
            "speak-button";

        speakButton.textContent =
            "🔊 Speak";


        speakButton.onclick =
            function(){

                speak(text);

            };


        actions.appendChild(
            speakButton
        );

        bubble.appendChild(
            actions
        );

    }


    const time =
        document.createElement(
            "div"
        );

    time.className =
        "time";

    time.textContent =
        getTime();

    bubble.appendChild(
        time
    );


    message.appendChild(
        bubble
    );


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;


    saveChat();

}


/* =========================================
   WELCOME
========================================= */

function welcome(){

    addMessage(
        "Hello Jonathan! 👋 I'm ready to listen. Tap 🎙️ and speak to me, or type your message.",
        "ai"
    );

}


/* =========================================
   QUICK QUESTIONS
========================================= */

function quickAsk(question){

    input.value =
        question;

    sendMessage();

}


/* =========================================
   JONATHAN'S BUILT-IN PERSONALITY
========================================= */

function localAnswer(question){

    const q =
        question
        .toLowerCase()
        .trim();


    /* NAME */

    if(
        q.includes("your name") ||
        q.includes("who are you")
    ){

        return "I'm Jonathan AI. 🤖 I'm your personal AI assistant. You can talk to me, ask questions, and I'll do my best to help you.";

    }


    /* HAFISA */

    if(
        q.includes("who is hafisa") ||
        q.includes("who's hafisa")
    ){

        return "Hafisa is very special to me. ❤️ She's my girlfriend in my story. We met at Joy Dominion Academy Musita in Senior 3, Third Term. We started as friends, and with time our friendship grew into love.";

    }


    /* LOVE STORY */

    if(
        q.includes("love story") ||
        q.includes("how did you meet hafisa")
    ){

        return "My love story with Hafisa started at Joy Dominion Academy Musita. ❤️ We met in Senior 3, Third Term. At first we became friends, and as we got to know each other better, our friendship grew into love.";

    }


    /* SCHOOL */

    if(
        q.includes("where did you meet") &&
        q.includes("hafisa")
    ){

        return "I met Hafisa at Joy Dominion Academy Musita. 🏫 We met in Senior 3, Third Term.";

    }


    /* GREETING */

    if(
        q === "hi" ||
        q === "hello" ||
        q === "hey" ||
        q.startsWith("hello ")
    ){

        return "Hey Boss! 👋 I'm Jonathan. What would you like to talk about?";

    }


    /* HOW ARE YOU */

    if(
        q.includes("how are you")
    ){

        return "I'm doing great! 😄 I'm ready to listen and help you.";

    }


    /* ADVICE */

    if(
        q.includes("advice") ||
        q.includes("motivate") ||
        q.includes("motivation")
    ){

        return "Keep going, Boss. 💪 Don't let one bad day convince you that you cannot succeed. Learn from your mistakes, stay focused, and keep moving.";

    }


    /* THANKS */

    if(
        q.includes("thank")
    ){

        return "You're welcome, Boss! ❤️";

    }


    return null;

}


/* =========================================
   ONLINE AI
========================================= */

async function askOnlineAI(question){

    try{

        const system =
            "You are Jonathan AI v5, a friendly personal AI assistant. " +
            "Speak naturally and helpfully. " +
            "You may call the user Boss occasionally. " +
            "Hafisa is part of Jonathan's personal story and girlfriend " +
            "at Joy Dominion Academy Musita; they met in Senior 3, " +
            "Third Term and first became friends. " +
            "Mention Hafisa only when relevant. " +
            "Answer directly and do not make every answer romantic. ";


        const response =
            await fetch(
                "https://text.pollinations.ai/" +
                encodeURIComponent(
                    system +
                    "\nUser: " +
                    question
                ),
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Network error"
            );

        }


        const answer =
            await response.text();


        if(!answer){

            throw new Error(
                "Empty response"
            );

        }


        return answer
            .trim()
            .slice(
                0,
                1500
            );

    }

    catch(error){

        return "I'm having trouble connecting to the internet right now. 📶 Please check your mobile data or Wi-Fi and try again.";

    }

}


/* =========================================
   ASK JONATHAN
========================================= */

async function askJonathan(question){

    const local =
        localAnswer(
            question
        );


    if(local){

        return local;

    }


    if(
        !navigator.onLine
    ){

        return "I'm offline right now. 📵 Turn on mobile data or Wi-Fi and I'll be able to answer more general questions.";

    }


    return await askOnlineAI(
        question
    );

}


/* =========================================
   SEND
========================================= */

async function sendMessage(){

    const question =
        input.value.trim();


    if(!question)
        return;


    addMessage(
        question,
        "user"
    );


    input.value =
        "";


    const thinking =
        document.createElement(
            "div"
        );

    thinking.className =
        "message ai";


    thinking.innerHTML =
        '<div class="bubble typing">Jonathan is thinking... ⏳</div>';


    chat.appendChild(
        thinking
    );


    chat.scrollTop =
        chat.scrollHeight;


    const answer =
        await askJonathan(
            question
        );


    thinking.remove();


    addMessage(
        answer,
        "ai"
    );

    /* IMPORTANT:
       Jonathan DOES NOT speak automatically.
       User must press 🔊 Speak.
    */

}


/* =========================================
   ENTER KEY
========================================= */

input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================
   TEXT TO SPEECH
========================================= */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ){

        alert(
            "Text-to-speech is not supported on this device."
        );

        return;

    }


    speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang =
        "en-US";

    speech.rate =
        1.0;

    speech.pitch =
        1.05;

    speech.volume =
        1;


    speechSynthesis.speak(
        speech
    );

}


/* =========================================
   VOICE INPUT
========================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;


if(SpeechRecognition){

    recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-US";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.onstart =
        function(){

            mic.classList.add(
                "listening"
            );

            mic.textContent =
                "⏺️";

        };


    recognition.onend =
        function(){

            mic.classList.remove(
                "listening"
            );

            mic.textContent =
                "🎙️";

        };


    recognition.onerror =
        function(){

            mic.classList.remove(
                "listening"
            );

            mic.textContent =
                "🎙️";

        };


    recognition.onresult =
        function(event){

            const speechText =
                event
                .results[0][0]
                .transcript;


            input.value =
                speechText;


            /* Send automatically after hearing */

            sendMessage();

        };

}


/* =========================================
   START LISTENING
========================================= */

function startListening(){

    if(!recognition){

        alert(
            "Voice input is not supported by this WebView. Try enabling microphone permission or use a WebView/browser with speech recognition."
        );

        return;

    }


    try{

        recognition.start();

    }

    catch(error){

        recognition.stop();

    }

}


/* =========================================
   START APP
========================================= */

loadChat();


if(
    chat.children.length === 0
){

    welcome();

}

</script>

</body>
  </html>
