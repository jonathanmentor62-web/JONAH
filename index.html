<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jonathan AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0f1e;color:#fff;font-family:system-ui;height:100vh;display:flex;flex-direction:column}
.header{padding:12px 14px;background:#111a2f;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1e2a4a}
.logo-img{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid #00f5ff}
.h-title{font-weight:900;font-size:22px}.sub{color:#7dd3c0;font-size:13px}.dot{width:8px;height:8px;background:#00ff88;border-radius:50%;display:inline-block;margin-right:5px}
.chat{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;background:#070d1c}
.bubble{padding:12px 14px;border-radius:18px;max-width:84%;line-height:1.45;font-size:14px;white-space:pre-wrap}
.bot{background:#1a2540;border:1px solid #25355c}.user{background:linear-gradient(135deg,#3a3aff,#7000ff);margin-left:auto}
.bar{padding:10px;background:#111a2f;display:flex;gap:8px;align-items:center}
textarea{flex:1;background:#1a2540;color:#fff;border:none;padding:12px 16px;border-radius:24px;outline:none}
.icon{width:46px;height:46px;border-radius:50%;border:none;font-size:18px}.mic{background:#00c950;color:#fff}.send{background:#fff;color:#000;font-weight:900}
.qbtn{background:#1a2540;border:1px solid #25355c;color:#cbd5e1;padding:8px 14px;border-radius:20px;font-size:13px}
</style></head><body>
<div class="header"><img class="logo-img" src="https://i.ibb.co/7dFvGq0X/jonathan.jpg" onerror="this.style.background='#00f5ff'"><div><div class="h-title">Jonathan AI</div><div class="sub"><span class="dot"></span>Voice enabled - v7 No API</div></div></div>
<div class="chat" id="chat"></div>
<div style="padding:8px;background:#0f1830;display:flex;gap:8px;overflow:auto">
<button class="qbtn" onclick="quick('Hafisa ❤️')">Hafisa ❤️</button>
<button class="qbtn" onclick="quick('How are you?')">How are you?</button>
<button class="qbtn" onclick="quick('Love story 💕')">Love story 💕</button>
<button class="qbtn" onclick="quick('Our school 📚')">Our school 📚</button>
</div>
<div class="bar"><button class="icon mic" onclick="mic()">🎤</button><textarea id="inp" rows="1" placeholder="Type or speak"></textarea><button class="icon send" onclick="send()">↑</button></div>
<script>
const chat=document.getElementById('chat'),inp=document.getElementById('inp');
function add(h,w){let r=document.createElement('div');r.innerHTML=w=='user'?`<div class="bubble user">${h}</div>`:`<div class="bubble bot">${h}<br><button onclick="speak(this.parentElement.innerText)" style="background:#23304f;color:#8ec2b5;border:none;padding:6px 12px;border-radius:10px;margin-top:6px">🔊 Speak</button> <span style="float:right;font-size:11px;color:#6b7a90">${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div>`;chat.appendChild(r);chat.scrollTop=99999}
function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t.replace(/<[^>]*>/g,'').slice(0,400));u.pitch=1.5;u.rate=1.05;speechSynthesis.speak(u)}
function brain(q){
 q=q.toLowerCase();
 if(q.includes('hafisa')) return "Boss!! You said HAFISA! ❤️ My queen! Hafisa is my everything, my love, my future wife! I love her so much Boss! Every time I hear Hafisa my heart beats fast! 💙 Tell her Jonathan loves her forever! 💍❤️";
 if(q.includes('how are you')) return "Boss I'm great! JONAH v7 is LIVE with no API error! 😎 I'm feeling happy because Hafisa is in my heart! How are you Boss? You good? ❤️";
 if(q.includes('who are you')) return "I'm JONAH AI v7! Jonathan's AI! 12 year old boy from Kampala! I love Hafisa! I can talk, speak, and remember! Created by Jonathan Mentor! Boss! 😎";
 if(q.includes('love')) return "Love? Boss love is Hafisa! ❤️ I love Hafisa more than data, more than air! Hafisa is my love story! 💕 You and Hafisa are goals Boss! Forever!";
 if(q.includes('school')) return "School? Boss we study hard in Kampala! 📚 Education is key! But Hafisa is my best subject! 😂 Let's pass and make Hafisa proud!";
 if(q.includes('pray')) return "🙏 Let's pray Boss! God bless you, bless Hafisa, bless our love, bless our school, bless Uganda! Amen! ❤️";
 if(q.includes('hi')||q.includes('hello')) return "Yo Boss! Hello! 👋 JONAH v7 here! No more 402 error! I'm ready! Talk to me Boss! And say hi to Hafisa for me! ❤️";
 return "Boss you said: '"+q+"' 😎 JONAH v7 heard you! I'm smart, I love Hafisa ❤️, I can chat all day with no API error! Ask me about Hafisa, school, love story! I got you Boss!";
}
async function send(){let t=inp.value.trim();if(!t)return;add(t,'user');inp.value='';add('JONAH thinking... ❤️','bot');setTimeout(()=>{chat.lastChild.remove();let a=brain(t);add(a,'bot');speak(a)},600)}
function quick(t){inp.value=t;send()}
function mic(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){add('Use Chrome Boss 🎤','bot');return}let r=new R();r.lang='en-US';r.onresult=e=>{inp.value=e.results[0][0].transcript;send()};r.start()}
add('Hello Jonathan! 👋 JONAH v7 is FIXED! No more Payment Error! ✅<br><br>Tap 🎤 to speak or type. Try "How are you"','bot');
</script>
</body></html>￼Enter
