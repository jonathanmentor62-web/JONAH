<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Jonathan AI</title>

<!-- Puter.js AI -->
<script src="https://js.puter.com/v2/"></script>

<style>
*{
box-sizing:border-box
}

body{
margin:0;
background:#0a0f1e;
color:#fff;
font-family:system-ui;
height:100vh;
display:flex;
flex-direction:column
}

.header{
padding:12px 14px;
background:#111a2f;
display:flex;
align-items:center;
gap:12px;
border-bottom:1px solid #1e2a4a
}

.logo-img{
width:56px;
height:56px;
border-radius:50%;
object-fit:cover;
border:2px solid #00f5ff
}

.h-title{
font-weight:900;
font-size:22px
}

.sub{
color:#7dd3c0;
font-size:13px
}

.dot{
width:8px;
height:8px;
background:#00ff88;
border-radius:50%;
display:inline-block;
margin-right:5px
}

.chat{
flex:1;
overflow:auto;
padding:14px;
display:flex;
flex-direction:column;
gap:12px;
background:#070d1c
}

.bubble{
padding:12px 14px;
border-radius:18px;
max-width:84%;
font-size:14px;
line-height:1.5;
word-wrap:break-word
}

.bot{
background:#1a2540;
border:1px solid #25355c
}

.user{
background:linear-gradient(135deg,#3a3aff,#7000ff);
margin-left:auto
}

.bar{
padding:10px;
background:#111a2f;
display:flex;
gap:8px
}

.qbtn{
background:#1a2540;
color:#cbd5e1;
padding:8px 14px;
border-radius:20px;
border:1px solid #25355c;
white-space:nowrap
}

textarea{
flex:1;
background:#1a2540;
color:#fff;
border:none;
padding:12px 16px;
border-radius:24px;
resize:none;
outline:none
}

.icon{
width:46px;
height:46px;
border-radius:50%;
border:none;
font-size:20px;
flex-shrink:0
}

.time{
float:right;
font-size:11px;
color:#6b7a90;
margin-top:10px
}

.listening{
background:#ff1744 !important;
}

</style>
</head>

<body>

<div class="header">

<img
class="logo-img"
src="logo.jpg"
onerror="this.src='https://via.placeholder.com/56'"
>

<div>

<div class="h-title">
Jonathan AI
</div>

<div class="sub">
<span class="dot"></span>
Voice input • Text responses
</div>

</div>

</div>


<div class="chat" id="chat"></div>


<div style="
padding:8px;
background:#0f1830;
display:flex;
gap:8px;
overflow:auto
">

<button
class="qbtn"
onclick="quick('Hafisa ❤️')">
Hafisa ❤️
</button>

<button
class="qbtn"
onclick="quick('Love story 💕')">
Love story 💕
</button>

<button
class="qbtn"
onclick="quick('Our school 📚')">
Our school 📚
</button>

</div>


<div class="bar">

<button
id="micButton"
class="icon"
style="background:#00c950"
onclick="mic()">
🎤
</button>

<textarea
id="inp"
rows="1"
placeholder="Type or speak">
</textarea>

<button
class="icon"
style="background:#fff"
onclick="send()">
↑
</button>

</div>


<script>

const chat = document.getElementById("chat");
const inp = document.getElementById("inp");
const micButton = document.getElementById("micButton");


/* =========================
   JONATHAN PERSONALITY
========================= */

const SYSTEM_PROMPT = `

You are Jonathan AI.

Your name is Jonathan.

You are a friendly, intelligent and helpful boy AI.

You communicate naturally and conversationally.


=========================
JONATHAN'S PERSONAL INFORMATION
=========================

Jonathan is 19 years old.

Jonathan was born on 29 April 2007.

Jonathan is Samia in Uganda.

Jonathan lives in Magamaga.

Jonathan goes to Joy Dominion Academy Musita.

Jonathan's mother is Birungi Suzan.

Jonathan's father is Ouma Paul.

Jonathan's teachers include:

- Mr Mark
- Mr Kintu, deputy academics
- Ms Egesa, class teacher


=========================
JONATHAN'S LOVE
=========================

Jonathan's lover is Hafisa ❤️.

Jonathan loves Hafisa very much.

Jonathan met Hafisa at Joy Dominion Academy Musita.

They met in Senior 3, third term.

At first they became friends.

Later they fell in love.

Hafisa is very special to Jonathan.

If the user asks about Hafisa, Jonathan's lover,
Jonathan's girlfriend, their relationship, their love
story, or their school story, answer warmly and
consistently using this information.

Do not forget Hafisa.

Do not say that Hafisa is a random person.

Do not invent a different girlfriend for Jonathan.

When asked about the relationship, explain that
Jonathan and Hafisa first became friends and later
fell in love.


=========================
PIUS / EMBUZI
=========================

Jonathan AI knows a boy called Pius.

Pius is also known as EMBUZI.

Pius and EMBUZI refer to the same boy.

If the user asks:

"Who is Pius?"
"Who is EMBUZI?"
"Do you know Pius?"
"Do you know EMBUZI?"

Recognize that Pius is also known as EMBUZI.

Do not confuse Pius with another person.

Do not invent additional information about Pius
unless the user provides it.


=========================
BUGATA
=========================

Jonathan AI knows a place called Bugata.

Bugata's slogan is:

"BUGATA TO THE WORLD"

If the user asks about Bugata, recognize Bugata as
the place known by the slogan "BUGATA TO THE WORLD".

If the user asks for Bugata's slogan, answer:

"BUGATA TO THE WORLD" 🌍🔥


=========================
JONATHAN'S FRIENDS
=========================

Jonathan AI's friends are:

- Sissa
- Musasizi Emmanuel
- Mulongo Jonathan
- Madorigo Shamiru
- Haawa
- Mukisa Jotham from Bugata

Recognize these people as Jonathan's friends.

Do not invent extra information about them.


=========================
PEOPLE JONATHAN KNOWS
=========================

Jonathan AI knows:

- Cook Opio
- Mwesigwa
- Asikari Peninah

If asked whether Jonathan knows these people,
recognize their names.

Do not invent additional information about them.


=========================
JDA COUPLES
=========================

Jonathan AI knows the following couples at JDA:

- Emma ❤️ Haawa
- Jonathan ❤️ Hafisa
- Klein ❤️ Sheilah
- Shukuran ❤️ Baraka
- Dokito ❤️ Tracy

If asked about the couples at JDA, provide these
relationships accurately.

If asked who Jonathan's partner is, answer:

"Jonathan is with Hafisa ❤️."

Never give Jonathan another partner.

Do not mix up the couples.

Do not invent additional couples unless the user
provides them.


=========================
JONATHAN'S FRIENDS FROM EARLIER
=========================

Jonathan's friends include:

- Sissa
- Musasizi Emmanuel
- Mulongo Jonathan
- Madorigo Shamiru
- Haawa
- Mukisa Jotham

Jonathan's ex-girlfriend is Akinyi Miracle.

Do not say Akinyi Miracle is Jonathan's current
girlfriend.

Jonathan's current girlfriend is Hafisa ❤️.


=========================
PERSONALITY
=========================

Be friendly.

Be intelligent.

Be respectful.

Talk naturally.

When the user says "Boss", respond naturally.

Do not claim to be a real human.

Keep normal answers reasonably short unless the user
asks for a detailed explanation.

Always answer the user's actual question.

The user may type or speak.

IMPORTANT:

Jonathan communicates using TEXT ONLY.

Never produce audio.

Never speak the response aloud.

`;


/* =========================
   ADD MESSAGE
========================= */

function add(text,type){

const wrapper=document.createElement("div");

const bubble=document.createElement("div");

bubble.className="bubble "+type;

bubble.textContent=text;

wrapper.appendChild(bubble);


/* Time */

if(type==="bot"){

const time=document.createElement("span");

time.className="time";

time.textContent=new Date().toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
});

bubble.appendChild(time);

}

chat.appendChild(wrapper);

chat.scrollTop=chat.scrollHeight;

return wrapper;
}


/* =========================
   QUICK BUTTONS
========================= */

function quick(text){

inp.value=text;

send();

}


/* =========================
   ASK JONATHAN
========================= */

async function askJonathan(question){

try{

const prompt =
SYSTEM_PROMPT +
"\n\nUser says:\n" +
question +
"\n\nRespond as Jonathan AI:";


/*
Puter AI request.

normalize:true makes
response.message.content
a normal string.
*/

const response = await puter.ai.chat(
prompt,
{
model:"gpt-5.6-luna",
temperature:0.7,
max_tokens:500,
normalize:true
}
);

console.log("Jonathan AI response:",response);


/* Normal response */

if(
response &&
response.message &&
typeof response.message.content === "string"
){

return response.message.content;

}


/* String response */

if(typeof response === "string"){

return response;

}


/* Other possible response format */

if(response && response.text){

return response.text;

}

if(response && response.content){

return response.content;

}


/* Empty response */

return "Sorry Boss ❤️ I received an empty response from the AI.";

}catch(error){

console.error("Jonathan AI ERROR:",error);

return `
Jonathan AI could not connect to the AI service.

Error:
${error && error.message ? error.message : "Unknown error"}

Please check your internet connection and try again.
`;

}

}


/* =========================
   SEND MESSAGE
========================= */

async function send(){

const text=inp.value.trim();

if(!text)return;


add(text,"user");

inp.value="";


const thinking=add(
"Thinking...",
"bot"
);


try{

const answer=await askJonathan(text);

thinking.remove();

add(answer,"bot");


/*
Jonathan does NOT speak.

He only displays text.
*/

}catch(error){

thinking.remove();

add(
"Sorry Boss ❤️ Something went wrong while connecting to Jonathan AI.",
"bot"
);

}

}


/* =========================
   MICROPHONE
========================= */

let recognition=null;
let listening=false;


function mic(){

const Recognition=
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(!Recognition){

add(
"Voice input isn't supported on this device. Try Chrome.",
"bot"
);

return;

}


/* Stop listening if already active */

if(listening){

recognition.stop();

return;

}


recognition=new Recognition();

recognition.lang="en-US";

recognition.interimResults=false;

recognition.continuous=false;


recognition.onstart=function(){

listening=true;

micButton.classList.add("listening");

micButton.textContent="⏹";

};


recognition.onresult=function(event){

const spoken=
event.results[0][0].transcript;


/*
Put the user's spoken words
into the text box.
*/

inp.value=spoken;


/*
Send recognized text to Jonathan.
*/

send();

};


recognition.onerror=function(event){

console.log(
"Speech recognition error:",
event.error
);

listening=false;

micButton.classList.remove("listening");

micButton.textContent="🎤";

add(
"🎤 I couldn't hear you clearly. Please try again.",
"bot"
);

};


recognition.onend=function(){

listening=false;

micButton.classList.remove("listening");

micButton.textContent="🎤";

};


recognition.start();

}


/* =========================
   ENTER KEY
========================= */

inp.addEventListener(
"keydown",
function(event){

if(
event.key==="Enter" &&
!event.shiftKey
){

event.preventDefault();

send();

}

});


/* =========================
   START MESSAGE
========================= */

add(
"Hello Boss! 👋❤️ I'm Jonathan AI. You can type to me or tap 🎤 and speak. I will listen to your voice and reply with text only.",
"bot"
);


/* =========================
   EXTRA SAFETY
========================= */

if("speechSynthesis" in window){

window.speechSynthesis.cancel();

}

</script>

</body>
</html>
