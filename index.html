here<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Jonathan AI</title>

<!-- Puter.js AI -->
<script src="https://js.puter.com/v2/"></script>

<style>
*{
box-sizing:border-box
}

body{
margin:0;
background:#0a0f1e;
color:#fff;
font-family:system-ui;
height:100vh;
display:flex;
flex-direction:column
}

.header{
padding:12px 14px;
background:#111a2f;
display:flex;
align-items:center;
gap:12px;
border-bottom:1px solid #1e2a4a
}

.logo-img{
width:56px;
height:56px;
border-radius:50%;
object-fit:cover;
border:2px solid #00f5ff
}

.h-title{
font-weight:900;
font-size:22px
}

.sub{
color:#7dd3c0;
font-size:13px
}

.dot{
width:8px;
height:8px;
background:#00ff88;
border-radius:50%;
display:inline-block;
margin-right:5px
}

.chat{
flex:1;
overflow:auto;
padding:14px;
display:flex;
flex-direction:column;
gap:12px;
background:#070d1c
}

.bubble{
padding:12px 14px;
border-radius:18px;
max-width:84%;
font-size:14px;
line-height:1.5;
word-wrap:break-word
}

.bot{
background:#1a2540;
border:1px solid #25355c
}

.user{
background:linear-gradient(135deg,#3a3aff,#7000ff);
margin-left:auto
}

.bar{
padding:10px;
background:#111a2f;
display:flex;
gap:8px
}

.qbtn{
background:#1a2540;
color:#cbd5e1;
padding:8px 14px;
border-radius:20px;
border:1px solid #25355c;
white-space:nowrap
}

textarea{
flex:1;
background:#1a2540;
color:#fff;
border:none;
padding:12px 16px;
border-radius:24px;
resize:none;
outline:none
}

.icon{
width:46px;
height:46px;
border-radius:50%;
border:none;
font-size:20px;
flex-shrink:0
}

.time{
float:right;
font-size:11px;
color:#6b7a90;
margin-top:10px
}

.listening{
background:#ff1744 !important;
}

</style>
</head>

<body>

<div class="header">

<img
class="logo-img"
src="logo.jpg"
onerror="this.src='https://via.placeholder.com/56'"
>

<div>

<div class="h-title">
Jonathan AI
</div>

<div class="sub">
<span class="dot"></span>
Voice input • Text responses
</div>

</div>

</div>


<div class="chat" id="chat"></div>


<div style="
padding:8px;
background:#0f1830;
display:flex;
gap:8px;
overflow:auto
">

<button
class="qbtn"
onclick="quick('Hafisa ❤️')">
Hafisa ❤️
</button>

<button
class="qbtn"
onclick="quick('Love story 💕')">
Love story 💕
</button>

<button
class="qbtn"
onclick="quick('Our school 📚')">
Our school 📚
</button>

</div>


<div class="bar">

<button
id="micButton"
class="icon"
style="background:#00c950"
onclick="mic()">
🎤
</button>

<textarea
id="inp"
rows="1"
placeholder="Type or speak">
</textarea>

<button
class="icon"
style="background:#fff"
onclick="send()">
↑
</button>

</div>


<script>

const chat = document.getElementById("chat");
const inp = document.getElementById("inp");
const micButton = document.getElementById("micButton");


/* =========================
   JONATHAN PERSONALITY
========================= */

const SYSTEM_PROMPT = `

You are Jonathan AI.

Your name is Jonathan.

You are a friendly, intelligent and helpful boy AI.

You communicate naturally and conversationally.

Jonathan's lover is Hafisa ❤️.

Jonathan loves Hafisa very much.

Jonathan met Hafisa at Joy Dominion Academy Musita.

They met in Senior 3, third term.

At first they became friends.

Later they fell in love.

Hafisa is very special to Jonathan.

If the user asks about Hafisa, Jonathan's lover,
Jonathan's girlfriend, their relationship, their love
story, or their school story, answer warmly and
consistently using this information.

Do not forget Hafisa.

Do not say that Hafisa is a random person.

Do not invent a different girlfriend for Jonathan.

When asked about the relationship, explain that
Jonathan and Hafisa first became friends and later
fell in love.

Be respectful.

Do not claim to be a real human.

Keep normal answers reasonably short unless the user
asks for a detailed explanation.

The user may type or speak.

Always answer the user's actual question.

IMPORTANT:
Jonathan communicates using TEXT ONLY.
Never produce or request audio.
Never speak the response aloud.

`;


/* =========================
   ADD MESSAGE
========================= */

function add(text,type){

const wrapper=document.createElement("div");

const bubble=document.createElement("div");

bubble.className="bubble "+type;

bubble.textContent=text;

wrapper.appendChild(bubble);


/* Time */

if(type==="bot"){

const time=document.createElement("span");

time.className="time";

time.textContent=new Date().toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
});

bubble.appendChild(time);

}

chat.appendChild(wrapper);

chat.scrollTop=chat.scrollHeight;

return wrapper;
}


/* =========================
   QUICK BUTTONS
========================= */

function quick(text){

inp.value=text;

send();

}


/* =========================
   ASK JONATHAN
========================= */

async function askJonathan(question){

try{

const prompt=
SYSTEM_PROMPT+
"\n\nUser says:\n"+
question+
"\n\nRespond as Jonathan AI:";


const response=await puter.ai.chat(
prompt,
{
model:"gpt-5.6-luna",
temperature:0.7,
max_tokens:500
}
);


if(typeof response==="string"){
return response;
}


if(response && response.message){

if(typeof response.message.content==="string"){
return response.message.content;
}

}


if(response && response.text){
return response.text;
}


if(response && response.content){
return response.content;
}


return "Sorry Boss, I couldn't understand the AI response.";

}catch(error){

console.error(error);

return `
Jonathan AI couldn't connect to the AI service right now.

Please check your internet connection and try again.

If this is the first time using Jonathan AI, Puter may ask
you to sign in or authorize the app.
`;

}

}


/* =========================
   SEND MESSAGE
========================= */

async function send(){

const text=inp.value.trim();

if(!text)return;


add(text,"user");

inp.value="";


const thinking=add(
"Thinking...",
"bot"
);


try{

const answer=await askJonathan(text);

thinking.remove();

add(answer,"bot");


/*
IMPORTANT:

There is NO speechSynthesis.speak().
Jonathan does NOT speak.
Jonathan only displays text.
*/


}catch(error){

thinking.remove();

add(
"Sorry Boss ❤️ Something went wrong while connecting to Jonathan AI.",
"bot"
);

}

}


/* =========================
   MICROPHONE
========================= */

let recognition=null;
let listening=false;


function mic(){

const Recognition=
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(!Recognition){

add(
"Voice input isn't supported on this device. Try Chrome.",
"bot"
);

return;

}


/* Stop listening if already active */

if(listening){

recognition.stop();

return;

}


recognition=new Recognition();

recognition.lang="en-US";

recognition.interimResults=false;

recognition.continuous=false;


recognition.onstart=function(){

listening=true;

micButton.classList.add("listening");

micButton.textContent="⏹";

};


recognition.onresult=function(event){

const spoken=
event.results[0][0].transcript;


/*
Put the user's spoken words into
the text box.
*/

inp.value=spoken;


/*
Send the recognized text to Jonathan.
Jonathan responds with TEXT ONLY.
*/

send();

};


recognition.onerror=function(event){

console.log(
"Speech recognition error:",
event.error
);

listening=false;

micButton.classList.remove("listening");

micButton.textContent="🎤";

add(
"🎤 I couldn't hear you clearly. Please try again.",
"bot"
);

};


recognition.onend=function(){

listening=false;

micButton.classList.remove("listening");

micButton.textContent="🎤";

};


recognition.start();

}


/* =========================
   ENTER KEY
========================= */

inp.addEventListener(
"keydown",
function(event){

if(
event.key==="Enter" &&
!event.shiftKey
){

event.preventDefault();

send();

}

});


/* =========================
   START MESSAGE
========================= */

add(
"Hello Boss! 👋❤️ I'm Jonathan AI. You can type to me or tap 🎤 and speak. I will listen to your voice and reply with text only.",
"bot"
);


/* =========================
   EXTRA SAFETY
========================= */

/*
Make sure any speech that may have been
left over from an earlier version is stopped.
*/

if("speechSynthesis" in window){

window.speechSynthesis.cancel();

}

</script>

</body>
   </html>
