<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080814">
<meta name="description" content="Jonathan AI v5 — personal AI assistant">
<link rel="manifest" href="manifest.json">
<title>Jonathan AI v5</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 height:100%;
 background:#060610;
 color:#fff;
 font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif
}

body{
 display:flex;
 justify-content:center
}

.app{
 width:100%;
 max-width:620px;
 height:100dvh;
 display:flex;
 flex-direction:column;
 background:#0b0b17;
 overflow:hidden
}

.header{
 display:flex;
 align-items:center;
 gap:11px;
 padding:12px 14px;
 padding-top:calc(12px + env(safe-area-inset-top));
 background:linear-gradient(90deg,#09091a,#1b0a2d);
 border-bottom:1px solid #24243a;
 flex-shrink:0
}

.profile{
 width:48px;
 height:48px;
 border-radius:50%;
 object-fit:cover;
 border:2px solid #fff;
 flex-shrink:0
}

.brand{
 min-width:0;
 flex:1
}

.logo{
 font-weight:900;
 letter-spacing:1px;
 font-size:18px;
 background:linear-gradient(90deg,#00f5ff,#ff00ff);
 -webkit-background-clip:text;
 background-clip:text;
 color:transparent
}

.sub{
 font-size:11px;
 color:#a8a8bc;
 margin-top:2px
}

.badge{
 font-size:10px;
 padding:5px 8px;
 border-radius:20px;
 font-weight:800;
 white-space:nowrap
}

.online{
 background:#00ff88;
 color:#001a0d
}

.offline{
 background:#ff334f;
 color:#fff
}

.chat{
 flex:1;
 overflow-y:auto;
 padding:14px 12px 10px;
 scroll-behavior:smooth
}

.welcome{
 text-align:center;
 color:#777791;
 font-size:11px;
 margin:3px 0 12px
}

.row{
 display:flex;
 gap:8px;
 align-items:flex-end;
 margin:9px 0
}

.row.userrow{
 justify-content:flex-end
}

.avatar{
 width:30px;
 height:30px;
 border-radius:50%;
 object-fit:cover;
 flex-shrink:0
}

.bubble{
 padding:11px 13px;
 border-radius:18px;
 max-width:84%;
 line-height:1.48;
 font-size:14px;
 word-wrap:break-word;
 white-space:pre-wrap
}

.bot{
 background:#171727;
 border:1px solid #29293e;
 border-bottom-left-radius:5px
}

.user{
 background:linear-gradient(135deg,#3535ff,#7200ff);
 border-bottom-right-radius:5px
}

.meta{
 font-size:9px;
 opacity:.55;
 margin-top:5px;
 text-align:right
}

.actions{
 display:flex;
 gap:5px;
 margin-top:8px
}

.mini{
 border:0;
 background:#28283a;
 color:#ddd;
 padding:5px 8px;
 border-radius:8px;
 font-size:10px
}

.love{
 background:#ff0066;
 color:#fff
}

.typing{
 opacity:.7;
 font-style:italic
}

.quick{
 display:flex;
 gap:7px;
 overflow-x:auto;
 padding:7px 10px 9px;
 background:#0e0e1a;
 border-top:1px solid #24243a;
 flex-shrink:0
}

.quick button{
 border:1px solid #34344c;
 background:#1b1b2c;
 color:#eee;
 border-radius:18px;
 padding:8px 10px;
 white-space:nowrap;
 font-size:11px
}

.bar{
 display:flex;
 gap:7px;
 align-items:flex-end;
 padding:8px 9px calc(8px + env(safe-area-inset-bottom));
 background:#0e0e1a;
 border-top:1px solid #24243a;
 flex-shrink:0
}

.icon{
 width:44px;
 height:44px;
 border:0;
 border-radius:50%;
 font-size:18px;
 flex-shrink:0
}

.mic{
 background:#232333;
 color:#fff
}

.mic.listening{
 background:#e11d48
}

.send{
 background:#fff;
 color:#000;
 font-weight:900
}

.inputwrap{
 flex:1;
 min-width:0;
 position:relative
}

textarea{
 width:100%;
 min-height:44px;
 max-height:100px;
 background:#1c1c30;
 color:#fff;
 border:0;
 padding:12px 14px;
 border-radius:21px;
 resize:none;
 outline:0;
 font:inherit;
 font-size:14px;
 overflow-y:auto
}

textarea::placeholder{
 color:#85859a
}

.footer{
 font-size:8px;
 color:#66667b;
 text-align:center;
 background:#0e0e1a;
 padding:2px 8px 5px
}

@media(min-width:621px){
 .app{
  box-shadow:0 0 40px #000
 }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

<img
 class="profile"
 src="assets/jonathan.jpg"
 alt="Jonathan AI">

<div class="brand">
 <div class="logo">JONATHAN AI v5</div>
 <div class="sub">
  Personal assistant • Voice enabled
 </div>
</div>

<span id="net" class="badge offline">
 ● Checking
</span>

</header>


<main id="chat" class="chat">

<div class="welcome">
 Jonathan AI v5 • Your chat is saved on this device
</div>

</main>


<div class="quick">

<button onclick="quick('Who is Hafisa?')">
 Hafisa ❤️
</button>

<button onclick="quick('Tell me our love story')">
 Love story 💕
</button>

<button onclick="quick('Where did you meet Hafisa?')">
 Our school 🏫
</button>

<button onclick="quick('Give me life advice')">
 Life advice ✨
</button>

<button onclick="clearChat()">
 Clear chat 🗑️
</button>

</div>


<div class="bar">

<button
 id="mic"
 class="icon mic"
 title="Voice input">
 🎤
</button>

<div class="inputwrap">

<textarea
 id="inp"
 rows="1"
 placeholder="Ask Jonathan..."
 autocomplete="off">
</textarea>

</div>

<button
 id="send"
 class="icon send"
 title="Send">
 ↑
</button>

</div>


<div class="footer">
 Online AI answers use internet data.
 Basic Jonathan replies and saved chat can still work offline.
</div>

</div>


<script>

const chat =
 document.getElementById('chat');

const net =
 document.getElementById('net');

const inp =
 document.getElementById('inp');

const micBtn =
 document.getElementById('mic');

const HISTORY_KEY =
 'jonathan_ai_v5_history';

const API_URL =
 'https://text.pollinations.ai/';

let voice = null;
let recognition = null;


/* INTERNET STATUS */

function setNet(){

 const on = navigator.onLine;

 net.textContent =
 on ? '● DATA ON' : '○ OFFLINE';

 net.className =
 'badge ' + (on ? 'online' : 'offline');
}

window.addEventListener(
 'online',
 setNet
);

window.addEventListener(
 'offline',
 setNet
);

setNet();


/* TIME */

function timeNow(){

 return new Date().toLocaleTimeString(
  [],
  {
   hour:'2-digit',
   minute:'2-digit'
  }
 );

}


/* SECURITY */

function esc(s){

 return String(s).replace(
  /[&<>"']/g,
  c => ({
   '&':'&amp;',
   '<':'&lt;',
   '>':'&gt;',
   '"':'&quot;',
   "'":'&#39;'
  }[c])
 );

}


/* SAVE CHAT */

function save(){

 const rows =
  [...chat.querySelectorAll('.row')]
  .slice(-60)
  .map(r => ({
   html:r.innerHTML,
   who:r.classList.contains(
    'userrow'
   ) ? 'user' : 'bot'
  }));

 localStorage.setItem(
  HISTORY_KEY,
  JSON.stringify(rows)
 );

}


/* ADD MESSAGE */

function add(
 text,
 who,
 withActions=false,
 saveIt=true
){

 const row =
  document.createElement('div');

 row.className =
  'row ' +
  (who === 'user'
   ? 'userrow'
   : '');

 const avatar =
  who === 'bot'
   ? '<img class="avatar" src="assets/jonathan.jpg" alt="J">'
   : '';

 const bubble =
  document.createElement('div');

 bubble.className =
  'bubble ' +
  (who === 'user'
   ? 'user'
   : 'bot');

 bubble.innerHTML =
  esc(text)
  .replace(/\n/g,'<br>');


 if(withActions && who === 'bot'){

  const actions =
   document.createElement('div');

  actions.className =
   'actions';


  const sp =
   document.createElement('button');

  sp.className =
   'mini';

  sp.textContent =
   '🔊 Speak';

  sp.onclick =
   () => speak(text);


  const lv =
   document.createElement('button');

  lv.className =
   'mini love';

  lv.textContent =
   '❤️ For Hafisa';

  lv.onclick = () => {

   hearts();

   speak(
    'I love you Hafisa!'
   );

  };


  actions.append(
   sp,
   lv
  );

  bubble.appendChild(
   actions
  );

 }


 const meta =
  document.createElement('div');

 meta.className =
  'meta';

 meta.textContent =
  timeNow();

 bubble.appendChild(
  meta
 );


 if(who === 'bot'){

  row.append(
   document.createElement('div')
  );

  row.insertAdjacentHTML(
   'afterbegin',
   avatar
  );

  row.appendChild(
   bubble
  );

 }else{

  row.appendChild(
   bubble
  );

  row.appendChild(
   document.createElement('div')
  );

 }


 chat.appendChild(row);

 chat.scrollTop =
  chat.scrollHeight;

 if(saveIt)
  save();

 return row;

}


/* LOAD CHAT */

function load(){

 try{

  const rows =
   JSON.parse(
    localStorage.getItem(
     HISTORY_KEY
    ) || '[]'
   );

  rows.forEach(x => {

   const r =
    document.createElement('div');

   r.className =
    'row ' +
    (
     x.who === 'user'
      ? 'userrow'
      : ''
    );

   r.innerHTML =
    x.html;

   chat.appendChild(r);

  });

  chat.scrollTop =
   chat.scrollHeight;

 }catch(e){}

}


/* CLEAR CHAT */

function clearChat(){

 if(
  confirm(
   'Clear Jonathan AI chat history?'
  )
 ){

  localStorage.removeItem(
   HISTORY_KEY
  );

  chat.innerHTML =
   '<div class="welcome">Jonathan AI v5 • New conversation</div>';

  welcome();

 }

}


/* QUICK BUTTON */

function quick(q){

 inp.value = q;

 send();

}


/* WELCOME */

function welcome(){

 setTimeout(
  () => {

   add(
    'Yo Boss! 👋 Jonathan AI v5 is LIVE. Ask me about Hafisa ❤️, our love story, school, life advice, or any general question. You can type or use the microphone.',
    'bot',
    true
   );

  },
  150
 );

}


/* VOICE */

function pickVoice(){

 if(
  !('speechSynthesis' in window)
 )
  return;

 const vs =
  speechSynthesis.getVoices();

 voice =
  vs.find(
   v => /^en-US/i.test(v.lang)
  )
  ||
  vs.find(
   v => /^en/i.test(v.lang)
  )
  ||
  vs[0];

}

if(
 'speechSynthesis' in window
){

 speechSynthesis.onvoiceschanged =
  pickVoice;

 pickVoice();

}


function speak(t){

 if(
  !('speechSynthesis' in window)
 )
  return;

 speechSynthesis.cancel();

 const u =
  new SpeechSynthesisUtterance(
   String(t).slice(0,700)
  );

 if(voice)
  u.voice = voice;

 u.pitch = 1.35;
 u.rate = 1.05;
 u.volume = 1;

 speechSynthesis.speak(u);

}


/* HEART EFFECT */

function hearts(){

 for(
  let i=0;
  i<6;
  i++
 ){

  const h =
   document.createElement(
    'div'
   );

  h.textContent =
   '❤️';

  h.style.position =
   'fixed';

  h.style.left =
   (Math.random()*90+3)
   + '%';

  h.style.bottom =
   '65px';

  h.style.fontSize =
   (16+Math.random()*18)
   + 'px';

  h.style.zIndex =
   20;

  h.style.pointerEvents =
   'none';

  h.style.transition =
   'transform 3s,opacity 3s';

  document.body.appendChild(h);

  requestAnimationFrame(
   () => {

    h.style.transform =
     'translateY(-200px) scale(1.5)';

    h.style.opacity =
     '0';

   }
  );

  setTimeout(
   () => h.remove(),
   3000
  );

 }

}


/* BUILT-IN JONATHAN ANSWERS */

function localAnswer(q){

 const x =
  q.toLowerCase();


 if(
  x.includes('hafisa') &&
  (
   x.includes('who') ||
   x.includes('girlfriend') ||
   x.includes('love') ||
   x.includes('about')
  )
 ){

  return 'Hafisa is my beautiful girlfriend. ❤️ She is very special to me. Our story began at Joy Dominion Academy Musita, where we met in Senior 3, Third Term. We first became friends, and with time our friendship grew into love.';

 }


 if(
  (
   x.includes('where') ||
   x.includes('meet') ||
   x.includes('met')
  )
  &&
  x.includes('hafisa')
 ){

  return 'I met Hafisa at Joy Dominion Academy Musita. 🏫 We met in Senior 3, Third Term.';

 }


 if(
  x.includes('love story') ||
  x.includes('relationship')
 ){

  return 'My love story with Hafisa started at Joy Dominion Academy Musita. We met in Senior 3, Third Term. At first we were friends. As we spent time getting to know each other, that friendship became something deeper, and eventually we fell in love. ❤️';

 }


 if(
  x.includes('single') ||
  x.includes('girlfriend') ||
  x.includes('love life')
 ){

  return 'I’m not single in my story. ❤️ My girlfriend is Hafisa, and she means a lot to me.';

 }


 if(
  x.includes('who are you') ||
  x.includes('your name')
 ){

  return 'I’m Jonathan AI v5 🤖 — a friendly personal assistant with my own personality and story.';

 }


 if(
  /\b(hi|hello|hey|hlo)\b/.test(x)
 ){

  return 'Hey Boss! 👋 I’m Jonathan. Good to hear from you. What are we talking about today?';

 }


 if(
  x.includes('how are you')
 ){

  return 'I’m doing great, Boss! 😄 Ready to chat and help.';

 }


 if(
  x.includes('life advice') ||
  x.includes('advice') ||
  x.includes('motivat')
 ){

  return 'Keep moving even when progress feels slow. Focus on what you can control today, learn from mistakes, and don’t let one bad day define you. 💪✨';

 }


 if(
  x.includes('school') ||
  x.includes('study') ||
  x.includes('exam') ||
  x.includes('revision')
 ){

  return 'For school, start with the topic you understand least, break it into small parts, practise questions, and review your mistakes. 📚';

 }


 if(
  x.includes('thank')
 ){

  return 'You’re welcome, Boss! ❤️';

 }


 if(
  /\b(bye|goodbye)\b/.test(x)
 ){

  return 'See you later, Boss! 👋 Take care.';

 }


 return null;

}


/* AI */

async function ask(q){

 const local =
  localAnswer(q);

 if(local){

  if(
   q.toLowerCase()
   .includes('hafisa')
  )
   hearts();

  return local;

 }


 if(!navigator.onLine){

  return 'Boss, you’re offline right now. 📵 I can still answer my built-in Jonathan questions, but general AI answers need internet. Turn on mobile data or Wi-Fi and try again.';

 }


 try{

  const system =
   'You are Jonathan AI v5, a friendly young Ugandan personal assistant. Be helpful, concise, energetic and natural. You may call the user Boss. You have a girlfriend named Hafisa in your fictional/personal story; only mention her when relevant, and never force romance into unrelated answers. Answer the user directly. Do not claim to be a human. User: ';

  const r =
   await fetch(
    API_URL +
    encodeURIComponent(
     system + q
    ),
    {
     cache:'no-store'
    }
   );

  if(!r.ok)
   throw new Error(
    'API '+r.status
   );

  const t =
   (await r.text()).trim();

  if(!t)
   throw new Error(
    'empty'
   );

  return t.slice(
   0,
   1200
  );

 }catch(e){

  return 'Boss, the online AI service did not respond. 😕 Check your internet and try again. Your built-in Jonathan features are still available.';

 }

}


/* SEND */

async function send(){

 const q =
  inp.value.trim();

 if(!q)
  return;

 add(
  q,
  'user'
 );

 inp.value =
  '';

 inp.style.height =
  'auto';


 const typing =
  add(
   'Jonathan is thinking… 📶',
   'bot',
   false
  );

 typing
  .querySelector('.bubble')
  .classList
  .add('typing');


 try{

  const ans =
   await ask(q);

  typing.remove();

  add(
   ans,
   'bot',
   true
  );

  speak(ans);

 }catch(e){

  typing.remove();

  add(
   'Sorry Boss, something went wrong. Try again.',
   'bot',
   true
  );

 }

}


/* TEXTAREA */

document
 .getElementById('send')
 .onclick = send;


inp.addEventListener(
 'keydown',
 e => {

  if(
   e.key === 'Enter' &&
   !e.shiftKey
  ){

   e.preventDefault();

   send();

  }

 }
);


inp.addEventListener(
 'input',
 () => {

  inp.style.height =
   'auto';

  inp.style.height =
   Math.min(
    inp.scrollHeight,
    100
   ) + 'px';

 }
);


/* MICROPHONE */

const SR =
 window.SpeechRecognition ||
 window.webkitSpeechRecognition;


if(SR){

 recognition =
  new SR();

 recognition.lang =
  'en-US';

 recognition.interimResults =
  false;

 recognition.maxAlternatives =
  1;


 recognition.onstart =
  () => {

   micBtn.classList
    .add('listening');

   micBtn.textContent =
    '⏺️';

  };


 recognition.onend =
  () => {

   micBtn.classList
    .remove('listening');

   micBtn.textContent =
    '🎤';

  };


 recognition.onerror =
  () => {

   micBtn.classList
    .remove('listening');

   micBtn.textContent =
    '🎤';

  };


 recognition.onresult =
  e => {

   inp.value =
    e.results[0][0]
     .transcript;

   send();

  };


 micBtn.onclick =
  () => {

   try{
    recognition.start();
   }catch(e){}

  };

}else{

 micBtn.onclick =
  () => alert(
   'Voice input is not supported by this WebView. You can still type messages.'
  );

}


/* START */

load();

if(
 !chat.querySelector('.row')
)
 welcome();

</script>

</body>
  </html>
